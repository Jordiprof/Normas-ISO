name: kit-iso auditar
description: >-
  Ejecuta la auditoría de cumplimiento normativo de kit-iso (ISO 27001, 25010, 5055,
  27701/RGPD, CRA, WCAG) sobre un directorio y publica el informe como artefacto.
author: Jordiprof
branding:
  icon: shield
  color: blue

inputs:
  directorio:
    description: Directorio a auditar (relativo a la raíz del repositorio).
    default: "."
  version:
    description: Tag o rama de kit-iso a instalar. Por defecto, la misma ref con la que se invoca la action.
    default: ""
  python-version:
    description: Versión de Python.
    default: "3.12"
  argumentos:
    description: Flags extra para `kit-iso auditar` (p. ej. `--excluir "ejemplos/*"`).
    default: ""
  token:
    description: Token con lectura del repositorio kit-iso (necesario si es privado). Por defecto, el del job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Instalar kit-iso
      shell: bash
      run: |
        REF="${{ inputs.version }}"
        if [ -z "$REF" ]; then REF="${{ github.action_ref }}"; fi
        pip install --quiet "kit-iso[auditoria] @ git+https://x-access-token:${{ inputs.token }}@github.com/Jordiprof/Normas-ISO.git@${REF}"

    - name: Auditar
      shell: bash
      run: |
        kit-iso auditar "${{ inputs.directorio }}" --salida informe-kit-iso.md ${{ inputs.argumentos }} \
          || { echo "::error::kit-iso: hay controles fallidos (ver informe-kit-iso.md)"; STATUS=1; }
        cat informe-kit-iso.md >> "$GITHUB_STEP_SUMMARY"
        exit ${STATUS:-0}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: informe-kit-iso
        path: informe-kit-iso.md
