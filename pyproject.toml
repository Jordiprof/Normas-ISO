[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-iso"
version = "1.0.1"
description = "Controles técnicos automatizables para cumplimiento normativo (ISO 27001, 25010, 9241, 40500, AI Act, CRA)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordi" }]
keywords = [
    "iso",
    "cumplimiento",
    "compliance",
    "seguridad",
    "ai-act",
    "cra",
    "wcag",
    "gdpr",
    "sbom",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9.0",
    "mysql-connector-python>=8.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Repository = "https://github.com/Jordiprof/Normas-ISO"
Changelog = "https://github.com/Jordiprof/Normas-ISO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "bandit>=1.7.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "coverage>=7.0.0",
    "radon>=6.0.0",
    "argon2-cffi>=23.0.0",
    "bcrypt>=4.0.0",
    "mypy>=1.8.0",
]
demo = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kit-iso = "kit_iso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kit_iso = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Dependencias sin stubs de tipos: se ignora solo el import, no el uso.
[[tool.mypy.overrides]]
module = ["psycopg2.*", "radon.*", "argon2.*", "bcrypt.*"]
ignore_missing_imports = true
