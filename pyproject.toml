[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-iso"
version = "0.1.0"
description = "Toolkit para cumplimiento ISO"
dependencies = [
"langchain>=0.1.0", 
"langgraph>=0.0.10", 
"torch>=2.0.0", 
"cryptography>=41.0.0", 
"psycopg2-binary>=2.9.0", 
"mysql-connector-python>=8.0.0", 
"pytest>=7.0.0", 
"bandit>=1.7.0", 
"fastapi>=0.109.0", 
"uvicorn>=0.27.0",
"beautifulsoup4>=4.12.0"  # Para accesibilidad (ISO 40500)
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88