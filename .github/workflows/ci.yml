name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Linter (ruff)
        run: ruff check src/ pruebas/

      - name: Formato (black)
        run: black --check src/ pruebas/

      - name: Análisis de seguridad (bandit)
        run: bandit -r src/ -ll

      - name: Tipos (mypy)
        run: mypy

      - name: Tests
        run: pytest pruebas/ -v
