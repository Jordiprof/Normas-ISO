name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ✅ PASO 1: Clonar el repositorio (faltaba completamente)
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # ✅ PASO 2: Instalar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ PASO 3: Instalar dependencias
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ✅ PASO 4: Ahora sí, linter y formatter
      - name: Comprobar estilo con ruff
        run: ruff check src/

      - name: Comprobar formato con black
        run: black --check src/

      # ✅ PASO 5: Tests al final
      - name: Ejecutar pruebas
        run: pytest